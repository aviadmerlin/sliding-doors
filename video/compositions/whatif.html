  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Every time below comes from window.__TIMING__ -- no literal

      const T = window.__TIMING__;
      const Wa = T.lines["05a_cancel"].words; // Cancel, it

      const cutTime = T.cuts["whatif_cut"].timeLocal;
      const clickTime = T.cuts["whatif_click"].timeLocal;
      const sceneDur = T.scenes["whatif"].duration;
      const clipBDur = sceneDur - cutTime;

      // Cut A: 1.5x, framing the Event select and its open option list.
      tl.fromTo("#wi-cam-a", { scale: 1.5, x: 0, y: -250 }, { scale: 1.56, x: -8, y: -272, duration: cutTime, ease: "none" }, 0);

      tl.fromTo("#wi-cam-b", { scale: 1.6, x: 365, y: -274 }, { scale: 1.66, x: 358, y: -288, duration: clipBDur, ease: "none" }, cutTime);

      // "Cancel it."
      [Wa[0], Wa[1]].forEach((w, i) => {
        tl.fromTo(
          `#wi-a-w${i + 1}`,
          { opacity: 0, y: 34, filter: "blur(11px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power4.out" },
          w.startLocal,

      });
      // "Replay the match."
      [Wb[0], Wb[1], Wb[2]].forEach((w, i) => {
        tl.fromTo(
          `#wi-b-w${i + 1}`,
          { opacity: 0, y: 34, filter: "blur(11px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power4.out" },

      // Ring the control being changed while "Cancel it." plays, off well
      // before the cut.
      tl.fromTo("#wi-ring-event", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, Wa[0].startLocal + 0.1);
      tl.to("#wi-ring-event", { opacity: 0, duration: 0.22, ease: "power2.in" }, cutTime - 0.26);

      // Ring the Run button, then punch it on the real recorded click.
      tl.fromTo("#wi-ring-run", { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, cutTime + 0.06);
