  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Every time below comes from window.__TIMING__ -- no literal
      // seconds in this file. See assets/timing.json / video/README.md.
      const T = window.__TIMING__;
      const W = T.lines["04_turning_point"].words; // 7 words: Minute,84,one,goal,swings,the,match
      const sceneDur = T.scenes["turning"].duration;
      const ringAt = T.cuts["turning_ring"].timeLocal; // word "swings" lands here

      tl.fromTo("#tn-score", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#tn-chart", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.05);

      const spans = ["#tn-w1", "#tn-w2", "#tn-w3", "#tn-w4", "#tn-w5", "#tn-w6", "#tn-w7"];
      spans.forEach((sel, i) => {
        tl.fromTo(
          sel,
          { opacity: 0, y: 32, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.28, ease: "power4.out" },
          W[i].startLocal,
        );
      });

      // Camera: hold the whole match, push to the 84' cliff, arriving
      // exactly as "swings" lands, then settle for the rest of the scene.
      const pushDur = 0.84;
      const pushStart = Math.max(0, ringAt - pushDur);
      tl.fromTo("#tn-stage", { scale: 1.18, x: 0, y: -16 }, { scale: 1.24, x: 0, y: -18, duration: pushStart, ease: "none" }, 0);
      tl.to("#tn-stage", { scale: 2.1, x: -1141, y: -115, duration: ringAt - pushStart, ease: "power2.inOut" }, pushStart);
      tl.to("#tn-stage", { scale: 2.16, x: -1176, y: -118, duration: sceneDur - ringAt, ease: "none" }, ringAt);

      // Ring draws on "swings" — the word that names the swing.
      tl.fromTo("#tn-ring", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, ringAt);

      tl.fromTo(
        "#tn-card",
        { opacity: 0, x: -40, filter: "blur(10px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.38, ease: "power4.out" },
        ringAt + 0.034,
      );

      window.__timelines["turning"] = tl;
    })();
