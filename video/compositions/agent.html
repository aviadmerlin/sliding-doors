  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Every time below comes from window.__TIMING__ -- no literal
      // seconds in this file. See assets/timing.json / video/README.md.
      const T = window.__TIMING__;
      const W7 = T.lines["07_ask_agent"].words; // Or,just,ask,the,AI,agent
      const W8 = T.lines["08_answer"].words;    // Same,answer,in,plain,English
      const cut1 = T.cuts["agent_cut_type_think"].timeLocal;
      const cut2 = T.cuts["agent_cut_answer"].timeLocal;
      const clickAt = T.cuts["agent_ask_click"].timeLocal;

      // Shot 1: 1.6x on the input, so the question is legible as it types.
      tl.fromTo("#ag-cam-type", { scale: 1.6, x: 124, y: -320 }, { scale: 1.66, x: 118, y: -336, duration: cut1, ease: "none" }, 0);
      // Shot 2: reframed onto the spinner.
      tl.fromTo("#ag-cam-think", { scale: 1.6, x: 437, y: -315 }, { scale: 1.64, x: 434, y: -325, duration: cut2 - cut1, ease: "none" }, cut1);
      // Shot 3: 2.2x on the clause that carries the numbers.
      tl.fromTo("#ag-cam-answer", { scale: 2.2, x: 193, y: -640 }, { scale: 2.3, x: 184, y: -672, duration: T.scenes["agent"].duration - cut2, ease: "none" }, cut2);

      // "Or just ask the AI agent."
      ["#ag-w1", "#ag-w2", "#ag-w3", "#ag-w4", "#ag-w5", "#ag-w6"].forEach((sel, i) => {
        tl.fromTo(
          sel,
          { opacity: 0, y: 32, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power4.out" },
          W7[i].startLocal,
        );
      });

      tl.fromTo("#ag-ring-input", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, W7[0].startLocal + 0.1);
      tl.to("#ag-ring-input", { opacity: 0, duration: 0.2, ease: "power2.in" }, cut1 - 0.1);

      // "Same answer, in plain English."
      ["#ag-w7", "#ag-w8", "#ag-w9", "#ag-w10", "#ag-w11"].forEach((sel, i) => {
        tl.fromTo(
          sel,
          { opacity: 0, y: 32, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power4.out" },
          W8[i].startLocal,
        );
      });

      // Sweep the highlight across the two numbers the agent wrote, once
      // "answer" (the word naming it) has landed.
      const bandAt = W8[1].startLocal;
      tl.fromTo("#ag-band", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.42, ease: "power3.out" }, bandAt);
      tl.to("#ag-band", { opacity: 0.6, duration: 0.5, ease: "power1.inOut" }, bandAt + 1.28);

      window.__timelines["agent"] = tl;
    })();
  </script>
