<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0b1220;
      font-family: Inter, sans-serif;
      color: #e5e7eb;
    }
    /* Faint engineering grid — the product is a simulator, not a billboard. */
    #hk-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 120px 120px;
    }
    #hk-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 45%, rgba(59, 130, 246, 0.1), transparent 62%);
    }
    #hk-copy {
      position: absolute;
      left: 192px;
      top: 0;
      width: 1536px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }
    .hk-line {
      display: block;
      white-space: nowrap;
    }
    #hk-l1 {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #9ca3af;
    }
    #hk-l2,
    #hk-l3 {
      font-size: 128px;
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.04;
    }
    /* The whole question is on screen from frame 0 as a ghost, then each
       word lights up on the syllable that says it. Gives a legible first
       frame (the social thumbnail) and a light-up rhythm rather than the
       usual word-by-word fade-in. */
    .w {
      display: inline-block;
      opacity: 0.34;
      will-change: transform, opacity, filter;
    }
    .amber {
      color: #f59e0b;
    }
    .red {
      color: #ef4444;
    }
    /* Underline that sweeps beneath the minute, drawn like the chart's marker. */
    #hk-rule {
      position: absolute;
      left: 50%;
      bottom: 318px;
      width: 560px;
      height: 4px;
      margin-left: -280px;
      background: #f59e0b;
      transform-origin: left center;
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="hk-grid" data-layout-ignore></div>
    <div id="hk-vignette" data-layout-ignore></div>

    <!-- data-start/data-duration: mount window, generated from
         window.__TIMING__.scenes.hook (this file's static HTML attributes
         can't read JS, so these three spans mount for the full scene --
         scripts/timing/03_apply_timing.py writes this literal duration
         whenever the manifest changes; the per-word reveal times below
         are computed live from the manifest, not written here). -->
    <div id="hk-copy" data-layout-allow-overflow>
      <div id="hk-l1" class="hk-line clip" data-start="0" data-duration="3.033" data-track-index="1">
        <span class="w" id="hk-w1">What</span> <span class="w" id="hk-w2">if</span>
        <span class="w" id="hk-w3">the</span>
      </div>
      <div id="hk-l2" class="hk-line clip" data-start="0" data-duration="3.033" data-track-index="2">
        <span class="w amber" id="hk-w4">84th-minute</span> <span class="w" id="hk-w5">goal</span>
      </div>
      <div id="hk-l3" class="hk-line clip" data-start="0" data-duration="3.033" data-track-index="3">
        <span class="w red" id="hk-w6">never</span> <span class="w" id="hk-w7">happened?</span>
      </div>
    </div>

    <div id="hk-rule" data-layout-ignore></div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Every word time below comes from window.__TIMING__.lines['01_hook'].words
      // (real WordBoundary events from the TTS engine) -- no literal
      // seconds in this file. See assets/timing.json / video/README.md.
      const T = window.__TIMING__;
      const W = T.lines["01_hook"].words;
      const sceneDur = T.scenes["hook"].duration;

      const spans = ["#hk-w1", "#hk-w2", "#hk-w3", "#hk-w4", "#hk-w5", "#hk-w6", "#hk-w7"];
      spans.forEach((sel, i) => {
        tl.fromTo(
          sel,
          { opacity: 0.34, scale: 0.97, filter: "blur(3px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" },
          W[i].startLocal,
        );
      });

      // Rule sweeps under "84th-minute" (word index 3) as the minute lands.
      tl.fromTo(
        "#hk-rule",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.46, ease: "power3.out" },
        W[3].startLocal,
      );

      // Slow push-in across the whole hook so it never sits still.
      tl.fromTo("#hk-copy", { scale: 1 }, { scale: 1.045, duration: sceneDur, ease: "none" }, 0);

      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
