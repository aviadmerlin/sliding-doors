  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Every time below comes from window.__TIMING__ -- no literal
      // seconds in this file. See assets/timing.json / video/README.md.
      // Word 9/10/11 ("9%","to","92%") are a proportional decomposition
      // of one merged TTS token -- see 01_generate_audio.py -- everything
      // else is a raw WordBoundary timestamp.
      const T = window.__TIMING__;
      const W = T.lines["06_reveal"].words;
      const wGoal = W[2];   // "goal" -- the fork names itself
      const wJumps = W[7];  // "jumps" -- anticipation begins
      const w9 = W[9];      // "9%"
      const w92 = W[11];    // "92%"

      tl.fromTo("#rv-label-left", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.05);
      tl.fromTo("#rv-num-left", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#rv-dir-left", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.3);

      // The empty right-hand side is labelled early so the question is
      // legible long before the answer arrives.
      tl.fromTo("#rv-label-right", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, wGoal.startLocal + 0.2);

      // "jumps" — anticipation. The bass swell is already running under
      // this (impact SFX peak lands on "92%", see assets/timing.json).
      // The old number dims.
      const jumpsToNinetyTwo = w92.startLocal - wJumps.startLocal;
      // Must finish strictly before the "9%" pulse below starts (w9.startLocal),
      // or its tail silently overrides the pulse's resting scale.
      const dimStart = wJumps.startLocal + 0.19;
      const dimDuration = Math.max(0.12, Math.min(0.66, w9.startLocal - dimStart - 0.02));
      tl.to("#rv-num-left", { opacity: 0.45, scale: 0.94, duration: dimDuration, ease: "power2.inOut" }, dimStart);

      // "9%" — one last pulse on the number about to be replaced, timed
      // to finish just before the slam.
      tl.to("#rv-num-left", { scale: 1.02, duration: 0.16, ease: "power2.out" }, w9.startLocal);
      tl.to("#rv-num-left", { scale: 0.94, duration: Math.max(0.1, w92.startLocal - w9.startLocal - 0.16), ease: "power2.inOut" }, w9.startLocal + 0.16);

      // "92%" — the slam. Everything lands on this frame.
      tl.fromTo("#rv-num-right", { opacity: 0, scale: 1.45, filter: "blur(22px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, w92.startLocal);
      tl.fromTo("#rv-glow", { opacity: 0 }, { opacity: 1, duration: 0.42, ease: "power2.out" }, w92.startLocal);
      tl.fromTo("#rv-dir-right", { opacity: 0, y: 20, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, w92.startLocal + 0.14);

      // Proof: the real cards this came from, held under the numbers.
      const proofAt = T.cuts["reveal_proof"].timeLocal;
      tl.fromTo("#rv-proof-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, proofAt);
      tl.fromTo("#rv-proof", { opacity: 0, y: 34 }, { opacity: 0.88, y: 0, duration: 0.44, ease: "power3.out" }, proofAt);

      window.__timelines["reveal"] = tl;
    })();
