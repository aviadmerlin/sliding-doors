<!-- Payoff scene -- SCRIPT.md beat 5. "A number lands... made physical"
     (story.md): Dunmore's real win probability (9%, the actual number
     from the Run-counterfactual result in Proof) flips hard to 92% as
     "to ninety-two" lands, with a progress ring filling and a real
     two-point line (minute 83 -> 84, the real fork) underneath for
     grounding. Door-wipe entrance/exit (recurring motif), continuous
     orbit + ring draw-on throughout. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <div
        id="po-root"
        data-composition-id="payoff"
        data-start="0"
        data-duration="5.6"
        data-width="1920"
        data-height="1080"
        data-motion-blur="on"
      >
        <style>
          @font-face {
            font-family: "Space Grotesk";
            font-weight: 700;
            font-style: normal;
            src: url("../assets/fonts/SpaceGrotesk-700.woff2") format("woff2");
          }
          #po-root {
            --bg: #0b1220;
            --border: #243049;
            --text: #e5e7eb;
            --text-dim: #9ca3af;
            --accent: #22c55e;
            --loss: #ef4444;
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: radial-gradient(120% 90% at 50% 40%, #0f1729 0%, var(--bg) 55%, #060910 100%);
          }
          #po-orbit {
            position: absolute;
            inset: -200px;
          }
          #po-grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px),
              linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 64px 64px;
            opacity: 0.2;
          }
          #po-flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--accent) 40%, transparent) 0%, transparent 60%);
            opacity: 0;
          }

          #po-label {
            position: absolute;
            left: 0;
            right: 0;
            top: 265px;
            text-align: center;
            font-family: "Inter", -apple-system, sans-serif;
            font-weight: 600;
            font-size: 42px;
            color: var(--text-dim);
            opacity: 0;
          }
          #po-ring-wrap {
            position: absolute;
            left: 50%;
            top: 330px;
            width: 460px;
            height: 460px;
            margin-left: -230px;
          }
          #po-num {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 128px;
            color: var(--text);
          }
          #po-chart {
            position: absolute;
            left: 50%;
            top: 840px;
            width: 700px;
            margin-left: -350px;
            opacity: 0;
          }
          #po-chart-caption {
            text-align: center;
            font-family: "Inter", -apple-system, sans-serif;
            font-size: 24px;
            color: var(--text-dim);
            margin-top: 10px;
          }

          .po-door {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            background: linear-gradient(135deg, #0f1729 0%, #070b14 100%);
            z-index: 6;
          }
          #po-door-l {
            left: 0;
            border-right: 2px solid var(--accent);
          }
          #po-door-r {
            right: 0;
            border-left: 2px solid var(--accent);
          }
        </style>

        <div id="po-stage" class="clip" data-start="0" data-duration="5.6" data-track-index="0">
          <div id="po-orbit">
            <div id="po-grid"></div>
          </div>
          <div id="po-flash"></div>
          <div id="po-label">Dunmore Town win probability</div>

          <div id="po-ring-wrap">
            <svg width="460" height="460" viewBox="0 0 460 460">
              <circle cx="230" cy="230" r="200" fill="none" stroke="#243049" stroke-width="16" />
              <circle
                id="po-ring"
                cx="230"
                cy="230"
                r="200"
                fill="none"
                stroke="#22c55e"
                stroke-width="16"
                stroke-linecap="round"
                transform="rotate(-90 230 230)"
                stroke-dasharray="1257"
                stroke-dashoffset="1257"
              />
            </svg>
            <div id="po-num">9%</div>
          </div>

          <svg id="po-chart" width="700" height="160" viewBox="0 0 700 160">
            <line x1="0" y1="140" x2="700" y2="140" stroke="#243049" stroke-width="2" />
            <path id="po-chart-path" d="M 40 125 L 350 125" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="500" stroke-dashoffset="500" />
            <path id="po-chart-path-2" d="M 350 125 L 660 20" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="500" stroke-dashoffset="500" />
            <circle cx="350" cy="125" r="7" fill="#e5e7eb" />
            <text x="350" y="112" fill="#9ca3af" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">84'</text>
          </svg>
          <div id="po-chart-caption">real forecast, minute 83 → 84 fork</div>
        </div>

        <div class="po-door clip" id="po-door-l" data-start="0" data-duration="5.6" data-track-index="2" data-layout-allow-occlusion data-layout-allow-overflow></div>
        <div class="po-door clip" id="po-door-r" data-start="0" data-duration="5.6" data-track-index="3" data-layout-allow-occlusion data-layout-allow-overflow></div>

        <audio
          id="po-voice"
          class="clip"
          data-start="0.3"
          data-duration="3.9"
          data-track-index="4"
          data-track-kind="voiceover"
          data-has-audio="true"
          src="../assets/audio/05-payoff.mp3"
        ></audio>
        <audio
          id="po-music"
          class="clip"
          data-start="0"
          data-duration="5.6"
          data-track-index="5"
          data-track-kind="music"
          data-has-audio="true"
          data-volume="0.5"
          data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":0.3,"v":0.35},{"t":4.1,"v":0.35},{"t":4.6,"v":1}]}]}'
          src="../assets/audio/music-PLACEHOLDER-SILENT.mp3"
        ></audio>
      </div>

      <script>
        (function () {
          var AL = 0.3;
          var doorL = document.getElementById("po-door-l");
          var doorR = document.getElementById("po-door-r");
          var orbit = document.getElementById("po-orbit");
          var label = document.getElementById("po-label");
          var num = document.getElementById("po-num");
          var ring = document.getElementById("po-ring");
          var flash = document.getElementById("po-flash");
          var chart = document.getElementById("po-chart");
          var pathA = document.getElementById("po-chart-path");
          var pathB = document.getElementById("po-chart-path-2");

          var CIRC = 1257;
          var pctToOffset = function (p) {
            return CIRC - (p / 100) * CIRC;
          };

          var tl = gsap.timeline({ paused: true });

          // Door open (fast, recurring motif).
          tl.fromTo(doorL, { xPercent: 0 }, { xPercent: -100, duration: 0.4, ease: "power3.inOut" }, 0);
          tl.fromTo(doorR, { xPercent: 0 }, { xPercent: 100, duration: 0.4, ease: "power3.inOut" }, 0);

          tl.to(orbit, { rotation: 5.6 * 4, duration: 5.6, ease: "none" }, 0);

          tl.to(label, { opacity: 1, y: -4, duration: 0.3, ease: "power2.out" }, 0.1 + AL);

          // 9% settles in first (real number, matches "nine percent" on
          // screen at 1.788-2.525s of the line -> AL+1.788).
          gsap.set(ring, { strokeDashoffset: CIRC });
          tl.to(ring, { strokeDashoffset: pctToOffset(9), duration: 0.5, ease: "power2.out" }, 1.0 + AL);
          tl.fromTo(num, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.0 + AL);

          // Chart draws on in the same window.
          tl.to(chart, { opacity: 1, duration: 0.3 }, 1.0 + AL);
          tl.to(pathA, { strokeDashoffset: 0, duration: 0.5, ease: "power1.out" }, 1.0 + AL);

          // The flip: "to ninety-two" (3.075-3.775 + AL) -- number counts
          // hard to 92%, ring fills, impact flash, second chart line draws.
          var counter = { v: 9 };
          tl.to(
            counter,
            {
              v: 92,
              duration: 0.55,
              ease: "power3.out",
              onUpdate: function () {
                num.textContent = Math.round(counter.v) + "%";
                ring.setAttribute("stroke-dashoffset", pctToOffset(counter.v));
              },
            },
            3.1 + AL,
          );
          tl.to(num, { scale: 1.18, duration: 0.12, ease: "power2.out" }, 3.1 + AL);
          tl.to(num, { scale: 1.0, duration: 0.3, ease: "power2.out" }, 3.22 + AL);
          tl.fromTo(flash, { opacity: 0 }, { opacity: 0.6, duration: 0.1 }, 3.15 + AL);
          tl.to(flash, { opacity: 0, duration: 0.5, ease: "power2.out" }, 3.25 + AL);
          tl.to(pathB, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 3.15 + AL);

          // Gentle continued life on the ring group for the hold.
          tl.to("#po-ring-wrap", { scale: 1.02, duration: 1.3, ease: "sine.inOut" }, 3.8 + AL);

          // Door close.
          tl.to(doorL, { xPercent: 0, duration: 0.4, ease: "power3.inOut" }, 5.15);
          tl.to(doorR, { xPercent: 0, duration: 0.4, ease: "power3.inOut" }, 5.15);

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["payoff"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
