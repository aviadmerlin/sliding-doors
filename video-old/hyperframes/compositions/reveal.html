<!-- Reveal scene -- SCRIPT.md beat 3. The hero brand moment: the door
     motif at its biggest/slowest -- a light-leak grows at the seam while
     "Until now." lands, then the doors part (0.65s, dramatic) to reveal
     the wordmark, which is PERFORMED word by word (not faded in) as "This
     is Sliding Doors" plays, "Doors" landing with a shimmer sweep. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <template>
      <div
        id="rv-root"
        data-composition-id="reveal"
        data-start="0"
        data-duration="5.1"
        data-width="1920"
        data-height="1080"
        data-motion-blur="on"
      >
        <style>
          @font-face {
            font-family: "Space Grotesk";
            font-weight: 500;
            font-style: normal;
            src: url("../assets/fonts/SpaceGrotesk-500.woff2") format("woff2");
          }
          @font-face {
            font-family: "Space Grotesk";
            font-weight: 700;
            font-style: normal;
            src: url("../assets/fonts/SpaceGrotesk-700.woff2") format("woff2");
          }
          #rv-root {
            --bg: #0b1220;
            --border: #243049;
            --text: #e5e7eb;
            --text-dim: #9ca3af;
            --accent: #22c55e;
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: var(--bg);
          }
          #rv-orbit {
            position: absolute;
            inset: -200px;
          }
          #rv-grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px),
              linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 64px 64px;
            opacity: 0.2;
          }
          #rv-glow {
            position: absolute;
            width: 1100px;
            height: 1100px;
            left: 50%;
            top: 50%;
            margin: -550px 0 0 -550px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--accent) 14%, transparent) 0%, transparent 65%);
            filter: blur(14px);
          }
          #rv-until {
            position: absolute;
            left: 0;
            right: 0;
            top: 330px;
            text-align: center;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 500;
            font-size: 48px;
            color: var(--text-dim);
            opacity: 0;
          }
          #rv-wordmark {
            position: absolute;
            left: 0;
            right: 0;
            top: 470px;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 24px;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 128px;
            letter-spacing: -0.01em;
          }
          #rv-w-this-is {
            color: var(--text-dim);
            font-size: 48px;
            font-weight: 500;
            align-self: center;
            position: absolute;
            top: -58px;
            left: 0;
            right: 0;
            text-align: center;
            opacity: 0;
          }
          .rv-wm-word {
            opacity: 0;
          }
          #rv-doors {
            color: var(--accent);
            position: relative;
          }
          #rv-shimmer {
            position: absolute;
            inset: -10% -20%;
            background: linear-gradient(100deg, transparent 40%, rgba(255, 255, 255, 0.55) 50%, transparent 60%);
            background-size: 300% 100%;
            background-position: 150% 0;
            mix-blend-mode: overlay;
            pointer-events: none;
          }

          .rv-door {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            background: linear-gradient(135deg, #0f1729 0%, #070b14 100%);
            z-index: 6;
          }
          #rv-door-l {
            left: 0;
            border-right: 2px solid var(--accent);
          }
          #rv-door-r {
            right: 0;
            border-left: 2px solid var(--accent);
          }
          .rv-seam-leak {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 6px;
            margin-left: -3px;
            background: var(--accent);
            filter: blur(10px);
            opacity: 0;
            z-index: 7;
          }
        </style>

        <div id="rv-stage" class="clip" data-start="0" data-duration="5.1" data-track-index="0">
          <div id="rv-orbit">
            <div id="rv-grid"></div>
            <div id="rv-glow"></div>
          </div>
          <div id="rv-until">Until now.</div>
          <div id="rv-wordmark">
            <div id="rv-w-this-is">This is</div>
            <span class="rv-wm-word" id="rv-w-sliding" style="color: var(--text)">Sliding</span>
            <span class="rv-wm-word" id="rv-doors">Doors<span id="rv-shimmer"></span></span>
          </div>
        </div>

        <div class="rv-seam-leak clip" id="rv-leak" data-start="0" data-duration="5.1" data-track-index="1" data-layout-allow-overflow></div>
        <div class="rv-door clip" id="rv-door-l" data-start="0" data-duration="5.1" data-track-index="2" data-layout-allow-occlusion data-layout-allow-overflow></div>
        <div class="rv-door clip" id="rv-door-r" data-start="0" data-duration="5.1" data-track-index="3" data-layout-allow-occlusion data-layout-allow-overflow></div>

        <audio
          id="rv-voice"
          class="clip"
          data-start="0.3"
          data-duration="2.6"
          data-track-index="4"
          data-track-kind="voiceover"
          data-has-audio="true"
          src="../assets/audio/03-reveal.mp3"
        ></audio>
        <audio
          id="rv-music"
          class="clip"
          data-start="0"
          data-duration="5.1"
          data-track-index="5"
          data-track-kind="music"
          data-has-audio="true"
          data-volume="0.5"
          data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":0.3,"v":0.35},{"t":2.9,"v":0.35},{"t":3.4,"v":1}]}]}'
          src="../assets/audio/music-PLACEHOLDER-SILENT.mp3"
        ></audio>
      </div>

      <script>
        (function () {
          var AL = 0.3;
          var doorL = document.getElementById("rv-door-l");
          var doorR = document.getElementById("rv-door-r");
          var leak = document.getElementById("rv-leak");
          var orbit = document.getElementById("rv-orbit");
          var until = document.getElementById("rv-until");
          var thisIs = document.getElementById("rv-w-this-is");
          var sliding = document.getElementById("rv-w-sliding");
          var doorsWord = document.getElementById("rv-doors");
          var shimmer = document.getElementById("rv-shimmer");

          var tl = gsap.timeline({ paused: true });

          // Continuous background orbit throughout.
          gsap.set(orbit, { transformOrigin: "50% 50%" });
          tl.to(orbit, { rotation: 5.1 * 3.5, duration: 5.1, ease: "none" }, 0);

          // "Until now." lands as the seam begins to glow (anticipation --
          // the doors are about to open, not sitting idle).
          tl.to(until, { opacity: 1, y: -6, duration: 0.3, ease: "power2.out" }, 0.1 + AL);
          tl.fromTo(leak, { opacity: 0, scaleY: 0.3 }, { opacity: 0.8, scaleY: 1, duration: 0.45, ease: "power2.in" }, 0.5 + AL);

          // The big, slow door-open -- this scene's hero version of the
          // recurring motif.
          tl.to(until, { opacity: 0, y: -24, duration: 0.25, ease: "power2.in" }, 0.95 + AL);
          tl.to(leak, { opacity: 0, duration: 0.2 }, 0.95 + AL);
          tl.to(doorL, { xPercent: -100, duration: 0.65, ease: "power3.inOut" }, 0.95 + AL);
          tl.to(doorR, { xPercent: 100, duration: 0.65, ease: "power3.inOut" }, 0.95 + AL);

          // Wordmark performed word by word, real narration timestamps
          // (This is: 1.355-1.658, Sliding: 1.671-2.053, Doors: 2.066-2.553).
          tl.fromTo(thisIs, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 1.355 + AL);
          tl.fromTo(
            sliding,
            { opacity: 0, scale: 0.85, filter: "blur(6px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out" },
            1.671 + AL,
          );
          tl.fromTo(
            doorsWord,
            { opacity: 0, scale: 0.8, filter: "blur(8px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" },
            2.066 + AL,
          );
          // "Doors" lands with a shimmer sweep -- the payoff word.
          tl.to(shimmer, { backgroundPosition: "-50% 0", duration: 0.55, ease: "power2.inOut" }, 2.3 + AL);

          // Slow continued push on the wordmark group for the hold (never
          // fully static).
          tl.fromTo(
            "#rv-wordmark",
            { scale: 1 },
            { scale: 1.035, duration: 2.0, ease: "none" },
            2.4 + AL,
          );

          // Door close -- bridges to Proof.
          tl.to(doorL, { xPercent: 0, duration: 0.4, ease: "power3.inOut" }, 4.65);
          tl.to(doorR, { xPercent: 0, duration: 0.4, ease: "power3.inOut" }, 4.65);

          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
